<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELMDECK · ARCHIVE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <div id="brandDot"></div>
      <div>
        <h1>HELMDECK</h1>
        <div class="sub">ARCHIVE VIEWER</div>
      </div>
    </div>
    <div id="tree"><div class="empty">LOADING</div></div>
    <div id="mapPanel" hidden>
      <div class="head"><span>TRACK</span><span id="mapCoord" class="mono"></span></div>
      <canvas id="map"></canvas>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="crumb" class="none">NO SELECTION</div>
      <div id="spacer"></div>
      <button id="osdBtn" class="on" type="button" title="OSD overlay">OSD</button>
      <button id="mapBtn" class="on" type="button" title="Track map">MAP</button>
      <div class="sep"></div>
      <select id="rate" title="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
      <div class="sep"></div>
      <button id="inBtn" type="button" disabled title="Set clip IN (I)">IN</button>
      <button id="outBtn" type="button" disabled title="Set clip OUT (O)">OUT</button>
      <span id="clipLbl" class="mono dim"></span>
      <button id="clipClr" type="button" hidden title="Clear clip">CLR</button>
      <div class="sep"></div>
      <a id="dlSeg" class="btn" hidden title="Download the segment under the playhead">SEG</a>
      <a id="exportBtn" class="btn go" hidden>EXPORT</a>
      <button id="keysBtn" type="button" title="Keyboard shortcuts">?</button>
    </header>

    <section id="stage">
      <video id="video" playsinline></video>
      <canvas id="osd"></canvas>
      <div id="notice" class="overlay" hidden></div>
      <div id="empty" class="overlay">PICK A RECORDING</div>
    </section>

    <div id="transport">
      <div id="timeline" title="Click to seek">
        <canvas id="tlCanvas"></canvas>
        <div id="tlHead" hidden></div>
      </div>
      <div id="tlRow">
        <span id="clock" class="mono">--:--:--<span class="ms">.--</span></span>
        <span id="rel" class="mono"></span>
        <span id="spacer2" style="flex:1 1 auto"></span>
        <span id="segNow" class="mono"></span>
      </div>
    </div>

    <footer id="graphPanel">
      <canvas id="graph"></canvas>
      <div id="legend"></div>
    </footer>
  </main>
</div>

<div id="keys" hidden>
  <div id="keysBox">
    <h2>KEYBOARD</h2>
    <table>
      <tr><td>SPACE / K</td><td>play, pause</td></tr>
      <tr><td>&larr; / &rarr;</td><td>5 s</td></tr>
      <tr><td>SHIFT &larr; / &rarr;</td><td>60 s</td></tr>
      <tr><td>[ / ]</td><td>previous, next segment</td></tr>
      <tr><td>, / .</td><td>frame step while paused</td></tr>
      <tr><td>I / O</td><td>clip in, clip out</td></tr>
      <tr><td>ESC</td><td>close this</td></tr>
    </table>
    <div class="hint">Timeline: click to seek. Graph: click to seek.</div>
  </div>
</div>

<script src="/vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
