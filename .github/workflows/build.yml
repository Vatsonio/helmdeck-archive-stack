name: build images

on:
  push:
    branches: [main]
    paths: ["sink/**", "ui/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [sink, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ steps.o.outputs.owner }}/helmdeck-archive-${{ matrix.component }}:latest
