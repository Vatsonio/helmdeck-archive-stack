name: build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the commit count is correct

      - name: Compute version and owner
        id: v
        run: |
          echo "version=1.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sink
        uses: docker/build-push-action@v6
        with:
          context: ./sink
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-sink:latest
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-sink:${{ steps.v.outputs.version }}

      - name: Build and push ui
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-ui:latest
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-ui:${{ steps.v.outputs.version }}

      - name: Cut release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          body: |
            Images:
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-sink:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/helmdeck-archive-ui:${{ steps.v.outputs.version }}
